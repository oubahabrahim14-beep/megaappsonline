<script>
let IDX=[];
async function load(){
  const res = await fetch('/search_index.json');
  IDX = await res.json();
  render();
}
function esc(s){return (s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');}
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const lang=document.getElementById('lang').value;
  const tag=document.getElementById('tag').value;
  const items=IDX.filter(x=>{
    const okQ=!q || (String(x.title||'').toLowerCase().includes(q) || String(x.description||'').toLowerCase().includes(q));
    const okL=!lang || x.lang===lang;
    const okT=!tag || x.tag===tag;
    return okQ && okL && okT;
  }).slice(0,120);
  const grid=document.getElementById('grid');
  grid.innerHTML = items.map(x=>`
    <a class="card" href="${x.url}">
      <h3>${esc(x.title)}</h3>
      <p class="meta">${esc(x.description||'')}</p>
      <div class="kv"><span>${x.tag||'Page'}</span><span>${x.lang}</span></div>
    </a>
  `).join('') || '<div class="card"><h3 style="margin:12px">No results</h3><p class="meta" style="margin:0 12px 12px">Try another keyword.</p></div>';
}
document.getElementById('q').addEventListener('input',render);
document.getElementById('lang').addEventListener('change',render);
document.getElementById('tag').addEventListener('change',render);
load();
</script>
