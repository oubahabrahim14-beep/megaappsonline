<script>
function go(){const q=document.getElementById('q404').value.trim();if(q)window.location.href='/search.html?q='+encodeURIComponent(q);}
const hot=[
  {name:'Krunker.io',slug:'krunker-io',cat:'FPS',desc:'Top browser FPS game.'},
  {name:'Slither.io',slug:'slither-io',cat:'IO',desc:'Classic snake multiplayer.'},
  {name:'Drift Hunters',slug:'drift-hunters',cat:'Racing',desc:'3D drifting perfection.'},
  {name:'Moto X3M',slug:'moto-x3m',cat:'Racing',desc:'Stunt motorcycle racing.'},
  {name:'Shell Shockers',slug:'shell-shockers',cat:'FPS',desc:'Egg battle FPS game.'},
  {name:'Subway Surfers',slug:'subway-surfers',cat:'Arcade',desc:'Endless runner classic.'},
];
const catTag={FPS:'t-fps',IO:'t-io',Racing:'t-race',Arcade:'t-arcade'};
document.getElementById('hot404').innerHTML=hot.map(g=>`<div class="card"><div class="thumb-wrap play-ov"><img class="thumb" src="/images/${g.slug}.webp" alt="${g.name}" loading="lazy" width="400" height="155" onerror="this.onerror=null;this.src='/images/${g.slug}.svg';this.onerror=function(){this.src='/images/fallback.webp';}"></div><div class="card-body"><div class="kv"><span class="${catTag[g.cat]||''}">${g.cat}</span><span class="t-free">Free</span></div><h3>${g.name}</h3><p class="meta">${g.desc}</p><div class="card-btns"><a class="btn small green" href="/play/${g.slug}.html" onclick="return MegaApps.trackPlay('${g.slug}')">▶ Play</a></div></div></div>`).join('');
</script>
